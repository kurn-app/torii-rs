[package]
name = "torii-storage-do"
description = "Cloudflare Durable Object SQLite storage backend for the torii authentication ecosystem"
version = "0.5.2"
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
torii-core = { path = "../torii-core", version = "0.5.2" }
